<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ACQUA NATACION | Control de clases</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <svg class="topbar-wave" width="100%" height="20" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,9 C55,20 100,0 150,8 C200,16 245,3 300,9 C335,13 365,6 400,10 L400,20 L0,20 Z" fill="var(--bg)"/>
      </svg>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img class="brand-logo" src="assets/logo-acqua-blanco.png" alt="">
        </span>
        <div>
          <h1 class="sr-only">ACQUA NATACION</h1>
          <p class="brand-eyebrow">Desde 2015 · Chía</p>
          <p id="businessNameLabel">Control de natacion</p>
        </div>
      </div>
      <label class="month-picker" id="monthPickerWrap" hidden>
        <span>Mes operativo</span>
        <input id="globalMonth" type="month">
      </label>
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
        <button id="logoutBtn" class="btn topbar-auth-btn" type="button" data-action="logout" hidden>Salir</button>
        <span id="syncDot" class="sync-dot sync-off" title="Sin nube configurada">&#9679;</span>
      </div>
    </header>

    <nav class="tabs" aria-label="Secciones principales">
      <button class="tab is-active" type="button" data-view="checkin"   data-admin="true">&#128247; Asistencia QR</button>
      <button class="tab"           type="button" data-view="register"  data-admin="true">&#43; Registrar alumno</button>
      <button class="tab"           type="button" data-view="dashboard" data-admin="true">Panel</button>
      <button class="tab"           type="button" data-view="students"  data-admin="true">Alumnos</button>
      <button class="tab"           type="button" data-view="cards"     data-admin="true">Carnets</button>
      <button class="tab"           type="button" data-view="events"    data-admin="true">Eventos</button>
      <button class="tab"           type="button" data-view="reports"   data-admin="true">Reportes</button>
      <button class="tab"           type="button" data-view="settings"  data-admin="true">Ajustes</button>
    </nav>

    <main id="app" class="app-shell" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <button id="scrollTopBtn" type="button" aria-label="Volver arriba" title="Volver arriba">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </button>

    <!-- Supabase JS v2 — necesario para autenticacion segura -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
