    <script>
      /* Interfaz de navegacion (menu Mas, menus ⋯, indicador deslizante, menu contraible y buscador Ctrl+K).
         Solo presentacion: no toca datos; las acciones usan los mismos botones data-view / data-action de la app. */
      (function(){
        var body=document.body;
        var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* ── Menu "Mas" y menus ⋯ ── */
        document.addEventListener("click",function(e){
          var t=e.target;
          if(t.closest("#moreBtn")){ body.classList.toggle("more-open"); placeIndicators(); return; }
          if(t.closest("[data-close-more]")||t.closest("[data-view]")){ body.classList.remove("more-open"); }
          document.querySelectorAll("details.menu[open]").forEach(function(d){
            if(!d.contains(t)||t.closest(".menu-list [data-action]")) d.removeAttribute("open");
          });
        });
        document.addEventListener("toggle",function(e){
          var d=e.target; if(!(d instanceof HTMLDetailsElement)||!d.classList.contains("menu")||!d.open) return;
          document.querySelectorAll("details.menu[open]").forEach(function(o){ if(o!==d) o.removeAttribute("open"); });
        },true);

        /* ── Indicador deslizante ── */
        function placeIndicators(){
          var side=document.querySelector(".side-nav"), bottom=document.querySelector(".bottom-nav");
          if(side){
            var ind=side.querySelector(".nav-indicator"), act=side.querySelector(".tab.is-active:not([hidden])");
            if(ind){ if(act&&act.offsetParent){ ind.style.transform="translateY("+act.offsetTop+"px)"; ind.style.height=act.offsetHeight+"px"; ind.style.opacity="1"; } else ind.style.opacity="0"; }
          }
          if(bottom){
            var bi=bottom.querySelector(".nav-indicator"), ba=bottom.querySelector(".tab.is-active:not([hidden]):not(.qr-fab)");
            if(bi){ if(ba&&ba.offsetParent){ var w=Math.min(64,ba.offsetWidth-6); bi.style.width=w+"px"; bi.style.transform="translateX("+(ba.offsetLeft+(ba.offsetWidth-w)/2)+"px)"; bi.style.opacity="1"; } else bi.style.opacity="0"; }
          }
        }
        var mo=new MutationObserver(function(){ requestAnimationFrame(placeIndicators); });
        document.querySelectorAll(".side-nav,.bottom-nav").forEach(function(n){ mo.observe(n,{subtree:true,attributes:true,attributeFilter:["class","hidden"]}); });
        window.addEventListener("resize",placeIndicators);
        if(document.fonts&&document.fonts.ready) document.fonts.ready.then(placeIndicators);
        setTimeout(placeIndicators,60); setTimeout(placeIndicators,600);

        /* ── Menu contraible (escritorio) ── */
        var KEY="acqua.navCollapsed";
        try{ if(localStorage.getItem(KEY)==="1") body.classList.add("nav-collapsed"); }catch(e){}
        var col=document.getElementById("navCollapse");
        if(col) col.addEventListener("click",function(){
          body.classList.toggle("nav-collapsed");
          try{ localStorage.setItem(KEY,body.classList.contains("nav-collapsed")?"1":"0"); }catch(e){}
          setTimeout(placeIndicators,320);
        });

        /* ── Buscador rapido Ctrl+K ── */
        var pal=document.getElementById("palette"), input=document.getElementById("paletteInput"), list=document.getElementById("paletteResults");
        var sel=0, items=[];
        var SECTIONS=[["checkin","Asistencia QR","Escanear carnets"],["dashboard","Panel","Resumen del dia"],["expiring","Vencimientos","Planes por vencer"],["students","Alumnos","Fichas, pagos y firmas"],["register","Registrar alumno","Nuevo alumno"],["cards","Carnets","Imprimir carnets QR"],["events","Eventos","Competencias y travesias"],["reports","Reportes","Asistencia y balance"],["settings","Ajustes","Respaldos y documentos"]];
        function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
        function norm(v){ return String(v||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
        function ini(n){ var p=String(n||"").trim().split(/\s+/); return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toUpperCase(); }
        function draw(){
          var q=norm(input.value.trim()), html="", n=0;
          var secs=SECTIONS.filter(function(x){ return !q||norm(x[1]+" "+x[2]).indexOf(q)>-1; });
          var studs=[];
          if(q&&window.acquaPalette){ studs=window.acquaPalette.students().filter(function(st){ return norm(st.name+" "+st.code+" "+st.phone).indexOf(q)>-1; }).sort(function(a,b){ return (b.active-a.active)||a.name.localeCompare(b.name,"es"); }).slice(0,8); }
          if(studs.length){
            html+='<p class="palette-group">Alumnos</p>';
            studs.forEach(function(st){
              var tone=st.remaining<=0?"danger":st.remaining<=2?"warn":"ok";
              html+='<div class="palette-item" role="option" data-i="'+(n++)+'"><button type="button" class="palette-main" data-action="go-to-student" data-id="'+esc(st.id)+'"><span class="avatar sm" aria-hidden="true">'+esc(ini(st.name))+'</span><span class="pi-text"><strong>'+esc(st.name)+'</strong><small>'+esc(st.code)+' · '+esc(st.plan)+(st.active?"":" · pausado")+'</small></span><span class="pi-badge '+tone+'">'+Math.max(0,st.remaining)+' clases</span></button>'+(st.active?'<button type="button" class="palette-side" data-action="register-class" data-id="'+esc(st.id)+'" title="Registrar clase">Registrar clase</button>':'')+'</div>';
            });
          }
          if(secs.length){
            html+='<p class="palette-group">Ir a</p>';
            secs.forEach(function(x){ html+='<div class="palette-item" role="option" data-i="'+(n++)+'"><button type="button" class="palette-main" data-view="'+x[0]+'"><span class="pi-ic">'+(document.querySelector('.side-nav [data-view="'+x[0]+'"] svg')||{outerHTML:""}).outerHTML+'</span><span class="pi-text"><strong>'+x[1]+'</strong><small>'+x[2]+'</small></span><span class="pi-go">↵</span></button></div>'; });
          }
          if(!n) html='<div class="palette-empty">Sin resultados para “'+esc(input.value)+'”.</div>';
          list.innerHTML=html; items=[].slice.call(list.querySelectorAll(".palette-item")); sel=Math.min(sel,Math.max(0,items.length-1)); mark();
        }
        function mark(){ items.forEach(function(el,i){ el.classList.toggle("is-sel",i===sel); if(i===sel) el.scrollIntoView({block:"nearest"}); }); }
        function openP(){ if(window.acquaPalette&&!window.acquaPalette.ready()) return; pal.hidden=false; body.classList.add("palette-open"); input.value=""; sel=0; draw(); input.focus(); }
        function closeP(){ pal.hidden=true; body.classList.remove("palette-open"); }
        document.getElementById("openPalette").addEventListener("click",openP);
        input.addEventListener("input",function(){ sel=0; draw(); });
        pal.addEventListener("click",function(e){ if(e.target.closest("[data-close-palette]")||e.target.closest("[data-view],[data-action]")) setTimeout(closeP,0); });
        document.addEventListener("keydown",function(e){
          if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); pal.hidden?openP():closeP(); return; }
          if(e.key==="Escape"){ body.classList.remove("more-open"); document.querySelectorAll("details.menu[open]").forEach(function(d){ d.removeAttribute("open"); }); if(!pal.hidden) closeP(); return; }
          if(pal.hidden) return;
          if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(items.length-1,sel+1); mark(); }
          else if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(0,sel-1); mark(); }
          else if(e.key==="Enter"){ e.preventDefault(); var b=items[sel]&&items[sel].querySelector(".palette-main"); if(b) b.click(); }
        });
      })();
    </script>
  </body>
</html>
