<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet — ACQUA NATACIÓN</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#F2F2F7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;gap:1.2rem}
#card{position:relative;width:270px;height:450px;border-radius:18px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#card img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;border-radius:18px}
#card .qr{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:71%;border-radius:10px;overflow:hidden;background:#fff;line-height:0}
#card .qr svg{width:100%;height:auto;display:block}
#card .nombre{position:absolute;top:67%;left:0;right:0;text-align:center;padding:0 8px;color:#0a2472;font-weight:800;letter-spacing:.04em;line-height:1.3}
#card .n1,#card .n2{font-size:1.15rem;display:block}
#card .cat{font-size:.9rem;font-weight:800;color:#FF6B00;margin-top:4px;display:block;letter-spacing:.02em}
#card .dias{font-size:.68rem;font-weight:600;color:#0a2472;margin-top:3px;display:block}
#card .fund{position:absolute;bottom:3%;left:0;right:0;text-align:center;font-size:.62rem;color:#6688bb;letter-spacing:.18em;font-weight:700}
.btns{display:flex;flex-direction:column;gap:10px;width:270px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s}
.btn-primary{background:linear-gradient(135deg,#03045E,#0077B6);color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.loading{text-align:center;color:#6B7280;font-size:.9rem}
.error{color:#EF4444;text-align:center;font-size:.88rem;max-width:270px}
.footer{font-size:.7rem;color:#9CA3AF;text-align:center}
</style>
</head>
<body>

<div id="loading" class="loading">Cargando carnet...</div>
<div id="errorBox" class="error" style="display:none"></div>

<div id="card" style="display:none">
  <img class="bg" id="bgImg" src="assets/carnet-Acqua.jpg" alt="">
  <div class="qr" id="qrDiv"></div>
  <div class="nombre">
    <span class="n1" id="nombre1"></span>
    <span class="n2" id="nombre2"></span>
    <span class="cat" id="categoria"></span>
    <span class="dias">Tienes 35 dias para consumir tu plan</span>
  </div>
  <span class="fund">DESDE 2015</span>
</div>

<div class="btns" id="btns" style="display:none">
  <button class="btn btn-primary" id="btnGuardar">
    ⬇ Guardar imagen del carnet
  </button>
  <button class="btn btn-wa" id="btnWA">
    📲 Compartir por WhatsApp
  </button>
</div>

<p class="footer">ACQUA NATACIÓN · Tu carnet digital oficial</p>

<script>
const SUPABASE_URL      = "https://sokfsbzzmrpijkmlpmag.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNva2ZzYnp6bXJwaWprbWxwbWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzYyNDgsImV4cCI6MjA5NDIxMjI0OH0.bor86ohZ-u9sUl_Lr85vDHhaw7rMyCRuNiX1ZAHVSaM";
const CLOUD_ROW_ID      = "acquacontrol-principal";
const CAT_MAP           = {Nino:"Infantil",Adulto:"Adulto",Matronatacion:"Matronatacion","Practica libre":"Practica libre"};

const params      = new URLSearchParams(location.search);
const studentCode = params.get("alumno");

/* ── QR generator (mismo algoritmo del app.js) ─────────────────── */
function qrSvg(text){
  const modules=qrMatrix(text);
  const border=4, size=modules.length+border*2;
  const dark=[];
  for(let y=0;y<modules.length;y++) for(let x=0;x<modules.length;x++)
    if(modules[y][x]) dark.push(`M${x+border},${y+border}h1v1h-1z`);
  return `<svg viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#fff"/><path d="${dark.join(" ")}" fill="#111827"/></svg>`;
}
function qrMatrix(text){const masks=Array.from({length:8},(_,m)=>buildQrMatrix(text,m));masks.sort((a,b)=>penaltyScore(a)-penaltyScore(b));return masks[0];}
function buildQrMatrix(text,mask){const version=4,size=version*4+17,dcw=80,ecw=20;const mod=Array.from({length:size},()=>Array(size).fill(false));const res=Array.from({length:size},()=>Array(size).fill(false));function sf(x,y,d){mod[y][x]=Boolean(d);res[y][x]=true;}function rv(x,y){res[y][x]=true;}function df(l,t){for(let dy=-1;dy<=7;dy++)for(let dx=-1;dx<=7;dx++){const x=l+dx,y=t+dy;if(x<0||y<0||x>=size||y>=size)continue;const d=dx>=0&&dx<=6&&dy>=0&&dy<=6&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4));sf(x,y,d);}}function da(cx,cy){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}function dt(){for(let i=8;i<size-8;i++){sf(i,6,i%2===0);sf(6,i,i%2===0);}}function rf(){for(let i=0;i<=8;i++)if(i!==6){rv(8,i);rv(i,8);}for(let i=0;i<8;i++)rv(size-1-i,8);for(let i=0;i<7;i++)rv(8,size-1-i);}function pd(cw){let bi=0,up=true;for(let r=size-1;r>=1;r-=2){if(r===6)r-=1;for(let v=0;v<size;v++){const y=up?size-1-v:v;for(let c=0;c<2;c++){const x=r-c;if(res[y][x])continue;const bit=bi<cw.length*8?((cw[Math.floor(bi/8)]>>>(7-(bi%8)))&1)===1:false;mod[y][x]=bit!==mb(mask,x,y);bi++;}}up=!up;}}function fb(mv){const bits=fmtB(1,mv);for(let i=0;i<=5;i++)sf(8,i,ba(bits,i));sf(8,7,ba(bits,6));sf(8,8,ba(bits,7));sf(7,8,ba(bits,8));for(let i=9;i<15;i++)sf(14-i,8,ba(bits,i));for(let i=0;i<8;i++)sf(size-1-i,8,ba(bits,i));for(let i=8;i<15;i++)sf(8,size-15+i,ba(bits,i));sf(8,size-8,true);}df(0,0);df(size-7,0);df(0,size-7);da(26,26);dt();rf();sf(8,size-8,true);const data=eqd(text,dcw);const ecc=rsr(data,ecw);pd(data.concat(ecc));fb(mask);return mod;}
function eqd(t,dcw){const bytes=Array.from(new TextEncoder().encode(t));if(bytes.length>78)throw new Error("too long");const bits=[];function ab(v,l){for(let i=l-1;i>=0;i--)bits.push((v>>>i)&1);}ab(4,4);ab(bytes.length,8);bytes.forEach(b=>ab(b,8));const cap=dcw*8;ab(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);const cw=[];for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|bits[i+j];cw.push(v);}for(let p=0xec;cw.length<dcw;p=p===0xec?0x11:0xec)cw.push(p);return cw;}
function fmtB(e,m){const d=(e<<3)|m;let r=d<<10;for(let i=14;i>=10;i--)if(((r>>>i)&1)!==0)r^=0x537<<(i-10);return((d<<10)|r)^0x5412;}
function ba(v,i){return((v>>>i)&1)!==0;}
function mb(m,x,y){switch(m){case 0:return(x+y)%2===0;case 1:return y%2===0;case 2:return x%3===0;case 3:return(x+y)%3===0;case 4:return(Math.floor(y/2)+Math.floor(x/3))%2===0;case 5:return((x*y)%2)+((x*y)%3)===0;case 6:return(((x*y)%2)+((x*y)%3))%2===0;case 7:return(((x+y)%2)+((x*y)%3))%2===0;default:return false;}}
function penaltyScore(M){const s=M.length;let sc=0;for(let y=0;y<s;y++){let rc=M[y][0],rl=1;for(let x=1;x<s;x++){if(M[y][x]===rc){rl++;if(rl===5)sc+=3;else if(rl>5)sc+=1;}else{rc=M[y][x];rl=1;}}}for(let x=0;x<s;x++){let rc=M[0][x],rl=1;for(let y=1;y<s;y++){if(M[y][x]===rc){rl++;if(rl===5)sc+=3;else if(rl>5)sc+=1;}else{rc=M[y][x];rl=1;}}}for(let y=0;y<s-1;y++)for(let x=0;x<s-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])sc+=3;}const dk=M.flat().filter(Boolean).length;sc+=Math.floor(Math.abs((dk*100)/(s*s)-50)/5)*10;return sc;}
const gfE=Array(512).fill(0),gfL=Array(256).fill(0);let gV=1;for(let i=0;i<255;i++){gfE[i]=gV;gfL[gV]=i;gV<<=1;if(gV&0x100)gV^=0x11d;}for(let i=255;i<gfE.length;i++)gfE[i]=gfE[i-255];
function gM(l,r){if(!l||!r)return 0;return gfE[gfL[l]+gfL[r]];}
function rsd(deg){const r=Array(deg).fill(0);r[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<r.length;j++){r[j]=gM(r[j],root);if(j+1<r.length)r[j]^=r[j+1];}root=gM(root,0x02);}return r;}
function rsr(data,deg){const div=rsd(deg),res=Array(deg).fill(0);data.forEach(b=>{const f=b^res.shift();res.push(0);div.forEach((c,i)=>{res[i]^=gM(c,f);});});return res;}

async function init(){
  if(!studentCode){
    document.getElementById("loading").style.display="none";
    document.getElementById("errorBox").textContent="No se especificó ningún alumno.";
    document.getElementById("errorBox").style.display="block";
    return;
  }
  try {
    const res=await fetch(SUPABASE_URL+"/rest/v1/app_state?id=eq."+encodeURIComponent(CLOUD_ROW_ID)+"&select=data",
      {cache:"no-store",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}});
    const rows=await res.json();
    const state=rows[0]?.data;
    if(!state) throw new Error("Sin datos");
    const student=state.students?.find(s=>String(s.code||"").toUpperCase()===studentCode.toUpperCase());
    if(!student) throw new Error("Alumno no encontrado");

    const parts=student.name.toUpperCase().trim().split(/\s+/);
    const si=parts.length>=4?2:1;
    document.getElementById("nombre1").textContent=parts.slice(0,si).join(" ");
    document.getElementById("nombre2").textContent=parts.slice(si).join(" ");
    document.getElementById("categoria").textContent=CAT_MAP[student.category]||student.category||"";
    document.getElementById("qrDiv").innerHTML=qrSvg("https://app-acqua.netlify.app/?checkin="+encodeURIComponent(student.code));

    document.getElementById("loading").style.display="none";
    document.getElementById("card").style.display="block";
    document.getElementById("btns").style.display="flex";
    document.title="Carnet "+student.name+" — ACQUA NATACIÓN";
    setupBtns(student);
  } catch(e){
    document.getElementById("loading").style.display="none";
    document.getElementById("errorBox").textContent="No se pudo cargar el carnet: "+e.message;
    document.getElementById("errorBox").style.display="block";
  }
}

function setupBtns(student){
  const btnG=document.getElementById("btnGuardar");
  const btnW=document.getElementById("btnWA");

  btnG.onclick=async function(){
    btnG.disabled=true; btnG.textContent="Generando imagen...";
    try {
      const canvas=await html2canvas(document.getElementById("card"),{scale:3,useCORS:true,allowTaint:true,backgroundColor:null});
      const link=document.createElement("a");
      link.download="carnet-"+student.code+".png";
      link.href=canvas.toDataURL("image/png");
      link.click();
    } catch(e){ alert("Error al generar imagen: "+e.message); }
    btnG.disabled=false; btnG.textContent="⬇ Guardar imagen del carnet";
  };

  btnW.onclick=async function(){
    btnW.disabled=true; btnW.textContent="Preparando...";
    const url="https://app-acqua.netlify.app/carnet-acqua.html?alumno="+encodeURIComponent(student.code);
    const msg="Hola "+student.name.split(" ")[0]+"! Aquí está tu carnet digital de ACQUA NATACIÓN:\n\n"+url+"\n\nAbre el enlace para ver tu carnet y guardarlo como imagen. Con ese código QR puedes registrar tu asistencia a clases.";
    try {
      const canvas=await html2canvas(document.getElementById("card"),{scale:3,useCORS:true,allowTaint:true,backgroundColor:null});
      canvas.toBlob(async function(blob){
        if(navigator.share && navigator.canShare && navigator.canShare({files:[new File([blob],"carnet.png",{type:"image/png"})]})){
          try {
            await navigator.share({title:"Mi carnet ACQUA",text:msg,files:[new File([blob],"carnet-"+student.code+".png",{type:"image/png"})]});
          } catch(e){ window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener"); }
        } else {
          window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener");
        }
        btnW.disabled=false; btnW.textContent="📲 Compartir por WhatsApp";
      },"image/png");
    } catch(e){
      window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener");
      btnW.disabled=false; btnW.textContent="📲 Compartir por WhatsApp";
    }
  };
}

init();
</script>
</body>
</html>
