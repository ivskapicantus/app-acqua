[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Estos archivos cambian seguido y los navegadores (sobre todo en celulares)
# tienden a guardarlos en cache por mucho tiempo. "no-cache" obliga al
# navegador a preguntarle siempre al servidor si hay una version mas nueva
# antes de usar la copia guardada, para que cada actualizacion que subas
# se refleje de inmediato en todos los dispositivos, sin que nadie tenga
# que hacer una recarga forzada manualmente.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registro-acqua.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/carnet-acqua.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/firma-acqua.html"
  [headers.values]
    Cache-Control = "no-cache"
