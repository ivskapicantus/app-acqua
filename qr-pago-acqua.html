<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Pago ACQUA Natación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: #F2F2F7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    gap: 2rem;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #3A3A3C;
    letter-spacing: -0.01em;
  }

  /* ── CARD ── */
  .card {
    width: 340px;
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 24px 48px rgba(0,55,100,0.12);
  }

  .card-header {
    background: linear-gradient(135deg, #03045E 0%, #0077B6 100%);
    padding: 1.6rem 1.5rem 1.4rem;
    text-align: center;
    position: relative;
  }

  .wave-divider {
    position: absolute;
    bottom: -1px; left: 0; right: 0; height: 24px;
  }

  .brand-name {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #fff;
    line-height: 1;
  }
  .brand-sub {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    margin-top: 3px;
  }

  .card-body {
    padding: 1.6rem 1.5rem 1.4rem;
    text-align: center;
  }

  .instruction {
    font-size: 0.82rem;
    font-weight: 600;
    color: #8E8E93;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
  }

  .qr-wrap {
    display: inline-flex;
    padding: 12px;
    background: #fff;
    border: 2px solid #E5E5EA;
    border-radius: 16px;
    margin-bottom: 1rem;
  }

  #qrcode canvas, #qrcode img {
    border-radius: 8px;
    display: block;
  }

  .url-pill {
    display: inline-block;
    background: #F2F2F7;
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.82rem;
    font-weight: 600;
    color: #0077B6;
    letter-spacing: -0.01em;
    margin-bottom: 1.2rem;
  }

  .methods {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }

  .method-badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    border: 1.5px solid;
  }
  .m-nequi  { background: #f5eeff; border-color: #9333ea; color: #7c3aed; }
  .m-pse    { background: #eef7ff; border-color: #0077B6; color: #023E8A; }
  .m-davi   { background: #fff4e5; border-color: #F4A524; color: #b45309; }
  .m-card   { background: #f0fdf4; border-color: #22c55e; color: #166534; }

  .card-footer {
    background: #F8F8FA;
    border-top: 1px solid #E5E5EA;
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-contact {
    font-size: 0.72rem;
    color: #8E8E93;
    line-height: 1.5;
  }
  .footer-contact strong { color: #3A3A3C; display: block; }

  .lock-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.68rem;
    font-weight: 600;
    color: #34C759;
  }

  /* ── CONTROLS (no se imprimen) ── */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-primary {
    background: #0077B6;
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,119,182,0.3);
  }
  .btn-primary:hover { background: #005F92; transform: translateY(-1px); }
  .btn-ghost {
    background: #fff;
    color: #0077B6;
    border: 1.5px solid #0077B6;
  }
  .btn-ghost:hover { background: #eef7ff; }

  .note {
    font-size: 0.75rem;
    color: #8E8E93;
    text-align: center;
    max-width: 340px;
  }

  /* ── PRINT ── */
  @media print {
    body { background: #fff; padding: 0; justify-content: flex-start; }
    .controls, h1, .note { display: none !important; }
    .card {
      box-shadow: none;
      border: 1px solid #ddd;
      margin: 0 auto;
    }
  }
</style>
</head>
<body>

<h1>QR de pagos — ACQUA Natación</h1>

<div class="card">
  <div class="card-header">
    <div class="brand-name">ACQUA</div>
    <div class="brand-sub">Natación · Chía</div>
    <svg class="wave-divider" viewBox="0 0 340 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,12 C60,24 120,0 180,12 C240,24 300,0 340,12 L340,24 L0,24 Z" fill="#ffffff"/>
    </svg>
  </div>

  <div class="card-body">
    <div class="instruction">Escanea para pagar tu plan</div>

    <div class="qr-wrap">
      <div id="qrcode"></div>
    </div>

    <div class="url-pill">acquanatacion.com/pagar</div>

    <div class="methods">
      <span class="method-badge m-nequi">💜 Nequi</span>
      <span class="method-badge m-pse">🏦 PSE</span>
      <span class="method-badge m-davi">🟠 Daviplata</span>
      <span class="method-badge m-card">💳 Tarjeta</span>
    </div>
  </div>

  <div class="card-footer">
    <div class="footer-contact">
      <strong>321 404 1318</strong>
      acquanatacion.com
    </div>
    <div class="lock-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Pago seguro
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  <button class="btn btn-ghost" onclick="descargarQR()">⬇️ Descargar QR</button>
</div>

<p class="note">💡 Cuando Wompi active tu cuenta, actualiza la URL en el código si usas un dominio diferente.</p>

<script>
  const URL_PAGO = "https://app-acqua.netlify.app/pagar";

  const qr = new QRCode(document.getElementById("qrcode"), {
    text: URL_PAGO,
    width: 220,
    height: 220,
    colorDark: "#03045E",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  function descargarQR() {
    setTimeout(() => {
      const canvas = document.querySelector("#qrcode canvas");
      if (!canvas) { alert("Usa el botón de imprimir para guardar."); return; }
      const link = document.createElement("a");
      link.download = "qr-pago-acqua.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }, 100);
  }
</script>
</body>
</html>
